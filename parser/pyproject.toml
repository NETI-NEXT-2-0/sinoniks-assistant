[project]
name = "partner-agent-parser"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["docling==2.150.0", "torch", "torchvision"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
