name: partner-agent
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile.api
    target: runtime
  image: partner-agent-api:stage1
  environment: &app-env
    PARTNER_DATABASE_URL: ${PARTNER_DATABASE_URL:?Generate .env first}
    PARTNER_ENVIRONMENT: ${PARTNER_ENVIRONMENT:-development}
    PARTNER_DEVELOPER_DIAGNOSTICS_ENABLED: ${PARTNER_DEVELOPER_DIAGNOSTICS_ENABLED:-false}
    PARTNER_PUBLIC_ORIGIN: ${PARTNER_PUBLIC_ORIGIN:-http://localhost:8080}
    PARTNER_SELF_REGISTRATION_ENABLED: ${PARTNER_SELF_REGISTRATION_ENABLED:-false}
    PARTNER_DEMO_PUBLIC_KNOWLEDGE: ${PARTNER_DEMO_PUBLIC_KNOWLEDGE:-false}
    PARTNER_RUNTIME_GRAPH_VERSION: ${PARTNER_RUNTIME_GRAPH_VERSION:-fixture-v1}
    PARTNER_RUNTIME_PROFILE: ${PARTNER_RUNTIME_PROFILE:-offline_fixture}
    PARTNER_DESIGN_INPUT_VERSION: ${PARTNER_DESIGN_INPUT_VERSION:-3}
    PARTNER_MODEL_ENDPOINT: ${PARTNER_MODEL_ENDPOINT:-}
    PARTNER_MODEL_NAME: ${PARTNER_MODEL_NAME:-}
    PARTNER_MODEL_WIRE_API: ${PARTNER_MODEL_WIRE_API:-chat_completions}
    PARTNER_MODEL_MAX_OUTPUT_TOKENS: ${PARTNER_MODEL_MAX_OUTPUT_TOKENS:-3000}
    PARTNER_MODEL_REASONING_EFFORT: ${PARTNER_MODEL_REASONING_EFFORT:-}
    PARTNER_MODEL_CONTEXT_WINDOW_TOKENS: ${PARTNER_MODEL_CONTEXT_WINDOW_TOKENS:-0}
    PARTNER_MODEL_API_KEY: ${PARTNER_MODEL_API_KEY:-}
    PARTNER_MODEL_INPUT_USD_PER_MILLION: ${PARTNER_MODEL_INPUT_USD_PER_MILLION:-0}
    PARTNER_MODEL_OUTPUT_USD_PER_MILLION: ${PARTNER_MODEL_OUTPUT_USD_PER_MILLION:-0}
    PARTNER_MODEL_REQUEST_CAP_USD: ${PARTNER_MODEL_REQUEST_CAP_USD:-0}
    PARTNER_MODEL_DAILY_CAP_USD: ${PARTNER_MODEL_DAILY_CAP_USD:-0}
    PARTNER_MODEL_PRICING_DECLARED: ${PARTNER_MODEL_PRICING_DECLARED:-false}
    PARTNER_MODEL_CONTEST_MODE: ${PARTNER_MODEL_CONTEST_MODE:-false}
    PARTNER_MODEL_CATALOG_ID: ${PARTNER_MODEL_CATALOG_ID:-}
    PARTNER_MODEL_PROVIDER_VARIANT: ${PARTNER_MODEL_PROVIDER_VARIANT:-}
    PARTNER_MODEL_PRICE_SNAPSHOT: ${PARTNER_MODEL_PRICE_SNAPSHOT:-}
    PARTNER_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    PARTNER_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    PARTNER_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    PARTNER_S3_REGION: ${S3_REGION}
    PARTNER_S3_ORIGINALS_BUCKET: ${S3_ORIGINALS_BUCKET}
    PARTNER_S3_DERIVED_BUCKET: ${S3_DERIVED_BUCKET}
  networks: [private]
  logging: *logging
x-hatchet-env: &hatchet-env
  DATABASE_URL: ${HATCHET_DATABASE_URL:?Generate .env first}
  SERVER_MSGQUEUE_KIND: postgres
  SERVER_MSGQUEUE_PUBSUB_KIND: postgres
  SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
  SERVER_GRPC_INSECURE: 't'
  SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
  SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
x-observability: &observability
  profiles: [observability]
  restart: unless-stopped
  networks: [private]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=3GB
      - --web.enable-remote-write-receiver
      - --log.level=warn
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    mem_limit: 768m
    healthcheck:
      test: [CMD, /bin/promtool, check, ready, --url=http://localhost:9090]
      interval: 10s
      timeout: 5s
      retries: 10
  loki:
    <<: *observability
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    mem_limit: 768m
  alloy:
    <<: *observability
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command: [run, --disable-reporting, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./infra/observability/bootstrap.jsonl:/etc/alloy/bootstrap-input.jsonl:ro
      - alloy_data:/var/lib/alloy
    depends_on: [prometheus, loki]
    mem_limit: 384m
  grafana:
    <<: *observability
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Generate observability secrets first}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_LOG_LEVEL: warn
    ports: ['127.0.0.1:13000:3000']
    networks: [private, management]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki]
    mem_limit: 512m
  phoenix:
    <<: *observability
    image: arizephoenix/phoenix:version-21.0.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    environment:
      PHOENIX_SQL_DATABASE_URL: ${PHOENIX_SQL_DATABASE_URL:?Generate observability secrets first}
      PHOENIX_HOST: '0.0.0.0'
      PHOENIX_ENABLE_AUTH: 'true'
      PHOENIX_SECRET: ${PHOENIX_SECRET:?Generate observability secrets first}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?Generate observability secrets first}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: '3'
      PHOENIX_TELEMETRY_ENABLED: 'false'
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: 'false'
      PHOENIX_DISABLE_AGENT_ASSISTANT: 'true'
      PHOENIX_ENABLE_MCP_SERVER: 'false'
      PHOENIX_ALLOWED_SANDBOX_PROVIDERS: NONE
      PHOENIX_WORKING_DIR: /data
    ports: ['127.0.0.1:16006:6006']
    networks: [private, management]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - phoenix_data:/data
    mem_limit: 1g
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:6006/readyz", timeout=3)']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env first}
      HATCHET_DB_PASSWORD: ${HATCHET_DB_PASSWORD:?Generate .env first}
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
    networks: [private]
    logging: *logging
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: [/garage, server, --single-node, --default-bucket]
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Generate .env first}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Generate .env first}
      GARAGE_DEFAULT_BUCKET: originals
    volumes:
      - ./infra/local/garage.toml:/etc/garage.toml:ro
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [private]
    logging: *logging
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [private]
    logging: *logging
  hatchet-migrate:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.114.2@sha256:fee74780773f7e76c4d090437a1cbdebad12a5ae90a5705ffad4e306d69b70d8
    command: /hatchet/hatchet-migrate
    environment: *hatchet-env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    logging: *logging
  hatchet-setup:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.114.2@sha256:e5d8fd721d196d51cb631871d11d120b06fd3a4f29fa063c06955d8ec8930873
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment:
      <<: *hatchet-env
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: 't'
      ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:?Generate .env first}
      ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:?Generate .env first}
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet-migrate: {condition: service_completed_successfully}
    networks: [private]
    logging: *logging
  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.114.2@sha256:247120b5fabb0085784d3adcf4aebfaca670a400c950d7f53d7ea95c858b4f21
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:8733/ready']
      interval: 10s
      timeout: 5s
      retries: 10
    environment: *hatchet-env
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet-setup: {condition: service_completed_successfully}
    networks: [private]
    logging: *logging
  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.114.2@sha256:f65358c7fcdaeb2b48abf23b737012bc9fd834bef3b976dd9f26a983cb4be0d8
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 10
    environment: *hatchet-env
    volumes:
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet-setup: {condition: service_completed_successfully}
    # Loopback only: remote access through SSH tunnel.
    ports: ['127.0.0.1:18080:80']
    networks: [management, private]
    logging: *logging
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  provision-checkpoints:
    <<: *app
    command: [python, -m, partner_agent.infra.provision]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *app
    # Only the internal Caddy/infrastructure network may reach this listener.
    command: [uvicorn, partner_agent.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    restart: unless-stopped
    networks: [private, web_control]
    environment:
      <<: *app-env
      PARTNER_SEARXNG_URL: ${PARTNER_SEARXNG_URL:-}
      PARTNER_WEB_OFFICIAL_DOMAINS: ${PARTNER_WEB_OFFICIAL_DOMAINS:-}
    depends_on:
      provision-checkpoints: {condition: service_completed_successfully}
      garage: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/live", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 5
  searxng:
    profiles: [web]
    image: searxng/searxng:2026.11.17-b99cf7496@sha256:0b9f3ddd85efc8df189e6543d65702abfa8f3ed1c32229a53f7707cd12b554ef
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_SETTINGS_PATH: /etc/partner-searxng.yml
    volumes:
      - ./infra/searxng/settings.yml:/etc/partner-searxng.yml:ro
    networks:
      web_control: {}
      web_egress:
        gw_priority: 1
    mem_limit: 512m
    logging: *logging
  agent-worker:
    <<: *app
    command: [python, -m, partner_agent.runtime.scheduler]
    networks: [edge, private]
    restart: unless-stopped
    environment: &runtime-env
      PARTNER_DATABASE_URL: ${PARTNER_DATABASE_URL}
      PARTNER_ENVIRONMENT: ${PARTNER_ENVIRONMENT:-development}
      PARTNER_DEVELOPER_DIAGNOSTICS_ENABLED: ${PARTNER_DEVELOPER_DIAGNOSTICS_ENABLED:-false}
      PARTNER_PUBLIC_ORIGIN: ${PARTNER_PUBLIC_ORIGIN:-http://localhost:8080}
      PARTNER_RUNTIME_PROFILE: ${PARTNER_RUNTIME_PROFILE:-offline_fixture}
      PARTNER_DEMO_PUBLIC_KNOWLEDGE: ${PARTNER_DEMO_PUBLIC_KNOWLEDGE:-false}
      PARTNER_DESIGN_INPUT_VERSION: ${PARTNER_DESIGN_INPUT_VERSION:-3}
      PARTNER_MODEL_ENDPOINT: ${PARTNER_MODEL_ENDPOINT:-}
      PARTNER_MODEL_NAME: ${PARTNER_MODEL_NAME:-}
      PARTNER_MODEL_WIRE_API: ${PARTNER_MODEL_WIRE_API:-chat_completions}
      PARTNER_MODEL_MAX_OUTPUT_TOKENS: ${PARTNER_MODEL_MAX_OUTPUT_TOKENS:-3000}
      PARTNER_MODEL_REASONING_EFFORT: ${PARTNER_MODEL_REASONING_EFFORT:-}
      PARTNER_MODEL_CONTEXT_WINDOW_TOKENS: ${PARTNER_MODEL_CONTEXT_WINDOW_TOKENS:-0}
      PARTNER_MODEL_API_KEY: ${PARTNER_MODEL_API_KEY:-}
      PARTNER_MODEL_INPUT_USD_PER_MILLION: ${PARTNER_MODEL_INPUT_USD_PER_MILLION:-0}
      PARTNER_MODEL_OUTPUT_USD_PER_MILLION: ${PARTNER_MODEL_OUTPUT_USD_PER_MILLION:-0}
      PARTNER_MODEL_REQUEST_CAP_USD: ${PARTNER_MODEL_REQUEST_CAP_USD:-0}
      PARTNER_MODEL_DAILY_CAP_USD: ${PARTNER_MODEL_DAILY_CAP_USD:-0}
      PARTNER_MODEL_PRICING_DECLARED: ${PARTNER_MODEL_PRICING_DECLARED:-false}
      PARTNER_MODEL_CONTEST_MODE: ${PARTNER_MODEL_CONTEST_MODE:-false}
      PARTNER_MODEL_CATALOG_ID: ${PARTNER_MODEL_CATALOG_ID:-}
      PARTNER_MODEL_PROVIDER_VARIANT: ${PARTNER_MODEL_PROVIDER_VARIANT:-}
      PARTNER_MODEL_PRICE_SNAPSHOT: ${PARTNER_MODEL_PRICE_SNAPSHOT:-}
      PARTNER_RUNTIME_AUTOMATIC_TAKEOVER: ${PARTNER_RUNTIME_AUTOMATIC_TAKEOVER:-false}
      PARTNER_RUNTIME_GRAPH_VERSION: ${PARTNER_RUNTIME_GRAPH_VERSION:-fixture-v1}
      PARTNER_RUNTIME_LEASE_SECONDS: ${PARTNER_RUNTIME_LEASE_SECONDS:-30}
      PARTNER_RUNTIME_HEARTBEAT_SECONDS: ${PARTNER_RUNTIME_HEARTBEAT_SECONDS:-10}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-dashboard:80}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-engine:7070}
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'true'
      HATCHET_CLIENT_WORKER_HEALTHCHECK_BIND_ADDRESS: 0.0.0.0
    depends_on:
      provision-checkpoints: {condition: service_completed_successfully}
      hatchet-engine: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
  relay:
    <<: *app
    command: [python, -m, partner_agent.runtime.relay]
    networks: [edge, private]
    restart: unless-stopped
    environment:
      <<: *runtime-env
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'false'
    depends_on:
      agent-worker: {condition: service_healthy}
  reconciler:
    <<: *app
    command: [python, -m, partner_agent.runtime.reconciler]
    networks: [edge, private]
    restart: unless-stopped
    environment:
      <<: *runtime-env
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'false'
    depends_on:
      provision-checkpoints: {condition: service_completed_successfully}
  ingest-worker:
    <<: *app
    command: [python, -m, partner_agent.documents.worker]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      garage: {condition: service_healthy}
  tests:
    <<: *app
    profiles: [checks]
    image: partner-agent-tests:stage1
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: tests
    environment:
      PARTNER_DATABASE_URL: ${PARTNER_DATABASE_URL}
      PARTNER_ENVIRONMENT: test
      PARTNER_PUBLIC_ORIGIN: http://localhost:8080
      PARTNER_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      PARTNER_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      PARTNER_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      PARTNER_S3_REGION: ${S3_REGION}
      PARTNER_S3_ORIGINALS_BUCKET: ${S3_ORIGINALS_BUCKET}
      PARTNER_S3_DERIVED_BUCKET: ${S3_DERIVED_BUCKET}
      PARTNER_TEST_DATABASE_URL: postgresql+psycopg://partner:${APP_DB_PASSWORD}@postgres:5432/partner_test
      GARAGE_TEST_ENDPOINT: http://garage:3900
      GARAGE_TEST_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_TEST_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_TEST_REGION: garage
      GARAGE_TEST_ORIGINALS_BUCKET: originals
      GARAGE_TEST_DERIVED_BUCKET: derived
    depends_on:
      postgres: {condition: service_healthy}
      garage: {condition: service_healthy}
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
    ports: ['127.0.0.1:8080:80', '127.0.0.1:8443:443']
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./outputs/partner-prototype/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    networks: [edge, private]
    logging: *logging
networks:
  edge: {}
  management: {}
  private:
    internal: true
  web_control:
    internal: true
  web_egress: {}
volumes:
  postgres_data: {}
  garage_metadata: {}
  garage_data: {}
  qdrant_data: {}
  hatchet_config: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  loki_data: {}
  alloy_data: {}
  grafana_data: {}
  phoenix_data: {}
